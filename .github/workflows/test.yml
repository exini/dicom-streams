name: Scala CI
on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JVM
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Run tests
        run: sbt test
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JVM
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Formatting
        run: sbt scalafmtSbtCheck scalafmtCheck test:scalafmtCheck
